version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: legalease-mysql
    restart: always
    environment:
      MYSQL_DATABASE: legalease
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: legalease_user
      MYSQL_PASSWORD: legalease_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: legalease-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalease-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/legalease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: legalease_user
      SPRING_DATASOURCE_PASSWORD: legalease_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: c2VjdXJlX2xlZ2FsZWFzZV9qd3Rfc2VjcmV0X2tleV93aXRoX2F0X2xlYXN0XzUxMl9iaXRzX2Zvcl9ocy01MTJfc2lnbmluZ19hbGdvcml0aG1fcHJvZHVjdGlvbg==
      APP_ENCRYPTION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - kyc_docs_data:/app/verification-docs
      - appeal_docs_data:/app/appeal-docs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalease-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  kyc_docs_data:
  appeal_docs_data:
